# .mint.toml — mint configuration. Only keys that differ from mint's compiled
# defaults are set; everything else rides on the defaults. Full key reference and
# defaults: run `mint setup`.

# Tracked churn that isn't user-facing release content, kept out of the AI
# release-notes and commit diffs so they describe the CLI: agent config and
# contributor rules, the design doc and its ideas, the test-isolation and
# release tooling, lockfile noise, and test scaffolding. Tests and their golden
# fixtures are the bulk of any change's diff, enough to crowd the behaviour out
# of the notes.
diff_exclude = [
    '.claude/**',
    'CLAUDE.md',
    'docs/**',
    'ideas/**',
    'scripts/**',
    'go.sum',
    '**/*_test.go',
    '**/testdata/**',
]

[release.hooks]
# No CI job runs the tests or builds a release: both happen on this Mac,
# before the irreversible tag + push. press check (preflight) fails in
# seconds where the signing keychain won't open or the notary login has
# lapsed, before mint writes notes. scripts/gated passes at once a commit
# whose tree scripts/gate recorded as passing every gate, or one that changes
# only docs and the like since such a tree; anything else runs every gate in
# full, the tests isolated, as CLAUDE.md requires. Then press prepare builds
# what .press.toml names, the notifications' app and the binaries that embed
# it, signed with this Mac's Developer ID and notarised, and keeps them, so a
# failure about the binary, the certificate or Apple's answer stops the
# release before its tag, with nothing public yet.
preflight = ['press check']
pre_tag = ['scripts/gated', 'press prepare']
# Once the tag and the release are up: press upload uploads the kept binaries
# to the release and moves the Homebrew formula on to them. mint only warns
# when it fails, so press upload <version>, run by hand, finishes the release.
post_release = ['press upload']

[release]
diff_exclude = ["testdata/", "art/", "internal/views/viewstest/", "demo/", "internal/testguard/", "internal/tokens/tokenstest/", "internal/skill/SKILL.md", ".gitignore", "internal/status/statustest/", "internal/capture/", "CONTRIBUTING.md", "internal/claude/claudetest/", "release", ".press.toml", ".golangci.yml"]
