version: 2

project_name: switchboard

builds:
  - id: switchboard
    main: ./cmd/switchboard
    binary: switchboard
    env:
      - CGO_ENABLED=0
    goos:
      - darwin   # switchboard is macOS only: its service is a LaunchAgent
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

# Signs and notarises only where the certificate's secret is set: a release without it stays
# ad-hoc signed, as Go's linker signs it.
notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids:
        - switchboard
      sign:
        certificate: "{{.Env.MACOS_SIGN_P12}}"
        password: "{{.Env.MACOS_SIGN_PASSWORD}}"
      notarize:
        issuer_id: "{{.Env.MACOS_NOTARY_ISSUER_ID}}"
        key_id: "{{.Env.MACOS_NOTARY_KEY_ID}}"
        key: "{{.Env.MACOS_NOTARY_KEY}}"
        wait: true
        timeout: 20m

archives:
  - id: switchboard
    formats:
      - tar.gz
    name_template: "switchboard_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - none*

changelog:
  disable: true

release:
  draft: false
  mode: keep-existing   # keep mint's release + AI-notes body, just upload the binaries
