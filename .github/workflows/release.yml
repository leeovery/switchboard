name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
      - '!v*-*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Jobs share no filesystem, so the checksums cross the boundary as outputs.
    outputs:
      version: ${{ steps.checksums.outputs.version }}
      sha256_arm64: ${{ steps.checksums.outputs.sha256_arm64 }}
      sha256_amd64: ${{ steps.checksums.outputs.sha256_amd64 }}
    steps:
      # GoReleaser signs wherever the certificate is set, and skips notarising without failing where
      # a notary secret is missing; a half-set or mangled signing fails here instead, before it.
      # Carriage returns are dropped as quill drops them, and a .p12 needs its password.
      - name: Check the signing secrets
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
        run: |
          if [ -z "$MACOS_SIGN_P12" ]; then
            echo "MACOS_SIGN_P12 isn't set: this release stays ad-hoc signed"
            exit 0
          fi
          for name in MACOS_SIGN_PASSWORD MACOS_NOTARY_ISSUER_ID MACOS_NOTARY_KEY_ID MACOS_NOTARY_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::$name isn't set, though MACOS_SIGN_P12 is: set it, or remove MACOS_SIGN_P12 to release ad-hoc signed"
              exit 1
            fi
          done
          for name in MACOS_SIGN_P12 MACOS_NOTARY_KEY; do
            if ! printf '%s' "${!name}" | tr -d '\r' | base64 -d >/dev/null 2>&1; then
              echo "::error::$name isn't base64: set it to the output of base64 -i on its file"
              exit 1
            fi
          done

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: '0'

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}

      - name: Extract checksums
        id: checksums
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          CHECKSUMS_FILE="dist/switchboard_${VERSION}_checksums.txt"
          SHA256_ARM64=$(grep "switchboard_${VERSION}_darwin_arm64.tar.gz" "$CHECKSUMS_FILE" | awk '{print $1}')
          SHA256_AMD64=$(grep "switchboard_${VERSION}_darwin_amd64.tar.gz" "$CHECKSUMS_FILE" | awk '{print $1}')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha256_arm64=$SHA256_ARM64" >> "$GITHUB_OUTPUT"
          echo "sha256_amd64=$SHA256_AMD64" >> "$GITHUB_OUTPUT"

  # Separate job so the tap update has its own fate. Folded into `release` it
  # shared one: a failure here (an expired CICD_PAT, a GitHub blip) turned a
  # fully-successful release red, and `gh run rerun --failed` was unusable
  # because retrying the job meant re-running `goreleaser release --clean`
  # against an already-published tag. Split, this retries on its own.
  homebrew:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch to homebrew-tools
        run: |
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.CICD_PAT }}" \
            https://api.github.com/repos/leeovery/homebrew-tools/dispatches \
            -d '{
              "event_type": "update-formula",
              "client_payload": {
                "tool": "switchboard",
                "version": "${{ needs.release.outputs.version }}",
                "sha256_arm64": "${{ needs.release.outputs.sha256_arm64 }}",
                "sha256_amd64": "${{ needs.release.outputs.sha256_amd64 }}"
              }
            }'
